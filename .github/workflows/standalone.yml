name: Standalone executables
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Executable / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux-x86_64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-15-intel, target: macos-x86_64}
          - {os: macos-15, target: macos-arm64}
          - {os: windows-latest, target: windows-x86_64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pyinstaller==6.22.3
      - run: python src/tools/build_standalone.py
      - name: Test executable and launcher outside checkout
        run: python src/tools/check_standalone.py --directory dist/native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: dist/native/
          if-no-files-found: error
