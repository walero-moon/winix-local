name: Install release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to install
        required: true
        default: v0.1.0
        type: string
  workflow_call:
permissions:
  contents: read
jobs:
  install:
    name: Wheel / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download the published wheel
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download --pattern '*.whl' --dir dist -- "$RELEASE_TAG"
      - name: Download this run's release files
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Install without source builds
        run: python src/tools/check_wheel.py --wheel-dir dist
