name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: auto
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          PLATFORMS: ${{ inputs.platforms || 'auto' }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python src/tools/release_scope.py validation --mode "$PLATFORMS" --base-ref "$BASE_REF" --output "$GITHUB_OUTPUT"
  package:
    needs: scope
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.full_matrix == 'true' && '["ubuntu-24.04","macos-15-intel","windows-latest"]' || '["ubuntu-24.04"]') }}
        python: ${{ fromJSON(needs.scope.outputs.full_matrix == 'true' && '["3.9","3.13"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m black --check src
      - run: python -m mypy
      - run: python -m winix_local.build --project-root .
      - run: python -B -m unittest discover -s src/tests -t src -p 'test_*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winix-local-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/winix_local.zip
          if-no-files-found: error
  home-assistant:
    name: Home Assistant
    runs-on: ubuntu-24.04
    container: ghcr.io/home-assistant/home-assistant:2026.10.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python -m pip install -e .
      - run: python -m winix_local.build --project-root .
      - run: python -B -m unittest discover -s src/tests/integration -p test_ha_runtime.py
