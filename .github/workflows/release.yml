name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      native_changed: ${{ steps.scope.outputs.native_changed }}
      reuse_tag: ${{ steps.scope.outputs.reuse_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python src/tools/release_scope.py release --output "$GITHUB_OUTPUT"
  validate:
    needs: scope
    uses: ./.github/workflows/validate.yml
    with:
      platforms: ${{ needs.scope.outputs.native_changed == 'true' && 'all' || 'linux' }}
  standalone:
    needs: [scope, validate]
    if: needs.scope.outputs.native_changed == 'true'
    uses: ./.github/workflows/standalone.yml
  build:
    needs: [scope, validate, standalone]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.standalone.result == 'success' || needs.standalone.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.scope.outputs.native_changed == 'true'
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Reuse unchanged setup executables
        if: needs.scope.outputs.native_changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_TAG: ${{ needs.scope.outputs.reuse_tag }}
        run: |
          gh release download "$REUSE_TAG" --pattern 'winix-local-*' --pattern SHA256SUMS --dir build/reuse
          python src/tools/release_scope.py reuse --source build/reuse --destination dist
      - name: Check version and prepare release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m winix_local.release --tag "$RELEASE_TAG" --with-standalone
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
  install:
    needs: [scope, build]
    uses: ./.github/workflows/install.yml
    with:
      full_matrix: ${{ needs.scope.outputs.native_changed == 'true' }}
  publish:
    needs: [build, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" --verify-tag
          --title "$RELEASE_TAG" --notes-file dist/release-notes.md
          dist/winix_local.zip dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          dist/winix-local-* dist/setup.sh dist/setup.ps1
