name: mqtt

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 256m
    ports:
      - "${MQTT_BIND_IP:?set the server LAN address}:1883:1883"
      - "${MQTT_BIND_IP:?set the server LAN address}:8883:8883"
    volumes:
      - ${MQTT_CONFIG_DIR:?set private config directory}:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  mqtt-data:
